            --card-bg: #ffffff;
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #00cec9;
            --high-value: #e17055;
            --text-dark: #2d3436;
            --text-gray: #636e72;
            --meshal-color: #0984e3;
            --hala-color: #e84393;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            color: var(--text-dark);
            overflow-x: hidden;
            min-width: 1440px; 
            width: 1440px;
        }

        /* --- Animations --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(255,255,255,0.2); }
            50% { box-shadow: 0 0 20px rgba(255,255,255,0.6); }
            100% { box-shadow: 0 0 5px rgba(255,255,255,0.2); }
        }
        @keyframes pulseGlowRed {
             0% { box-shadow: 0 4px 10px rgba(225, 112, 85, 0.1); }
             50% { box-shadow: 0 8px 25px rgba(225, 112, 85, 0.4); }
             100% { box-shadow: 0 4px 10px rgba(225, 112, 85, 0.1); }
        }

        .animate-in { animation: slideUp 0.8s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        /* --- Hero Section --- */
        .hero-section {
            background: linear-gradient(120deg, #6c5ce7 0%, #81ecec 100%);
            color: white;
            padding: 30px 5%;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.3);
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            position: relative;
            overflow: hidden;
            height: 220px;
        }

        .hero-section::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg); pointer-events: none;
        }

        .header-branding { display: flex; align-items: center; gap: 20px; z-index: 2; }
        .logo-frame {
            width: 80px; height: 80px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 3px solid rgba(255,255,255,0.5);
            animation: pulseGlow 3s infinite;
        }
        .logo-img { width: 90%; height: 90%; object-fit: cover; border-radius: 50%; }
        
        .hero-content h1 { margin: 0; font-size: 1.8rem; font-weight: 400; opacity: 0.95; }
        .hero-total {
            margin: 5px 0 0 0; font-size: 3.5rem; font-weight: 900;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        /* --- عناصر التحكم الجديدة --- */
        .admin-controls { display: flex; align-items: center; gap: 15px; margin-top: 10px; z-index: 10; }
        .btn-paste { 
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); 
            padding: 8px 15px; border-radius: 12px; color: white; cursor: pointer; font-size: 0.9rem;
            transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-paste:hover { background: rgba(255,255,255,0.3); }
        .month-selector { 
            padding: 8px 12px; border-radius: 10px; border: none; font-family: 'Tajawal'; 
            font-weight: bold; color: var(--primary); outline: none; cursor: pointer;
        }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(5px);
        }
        .modal-box {
            background: white; padding: 30px; border-radius: 25px; width: 700px; max-width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: right;
        }
        .paste-area {
            width: 100%; height: 250px; margin: 15px 0; padding: 15px; border: 2px solid #eee;
            border-radius: 15px; resize: none; font-family: monospace; box-sizing: border-box;
        }

        /* بقية التنسيقات الأصلية */
        .hero-stats { display: flex; gap: 20px; z-index: 2; }
        .stat-box {
            text-align: center; background: rgba(255,255,255,0.15);
            padding: 15px 25px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s; min-width: 140px;
        }
        .stat-box i { font-size: 1.5rem; margin-bottom: 10px; opacity: 0.8; }
        .stat-box strong { display: block; font-size: 1.6rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 25px 50px 25px; }
        .section-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; color: var(--text-dark); }
        .section-title i { color: var(--primary); background: rgba(108, 92, 231, 0.1); padding: 10px; border-radius: 12px; }
        .partners-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: -70px; margin-bottom: 50px; position: relative; z-index: 10; }
        .partner-card { background: white; border-radius: 25px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-between; transition: transform 0.3s ease; border: 2px solid transparent; }
        .p-info { display: flex; align-items: center; gap: 20px; }
        .p-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; }
        .p-name { font-size: 1.2rem; font-weight: 700; color: var(--text-gray); }
        .p-label { font-size: 0.9rem; opacity: 0.7; }
        .p-amount { font-size: 2rem; font-weight: 900; }
        .style-hala .p-icon { background: linear-gradient(135deg, #fd79a8, #e84393); box-shadow: 0 5px 15px rgba(232, 67, 147, 0.3); }
        .style-hala .p-amount { color: var(--hala-color); }
        .style-meshal .p-icon { background: linear-gradient(135deg, #74b9ff, #0984e3); box-shadow: 0 5px 15px rgba(9, 132, 227, 0.3); }
        .style-meshal .p-amount { color: var(--meshal-color); }
        .clients-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 50px; }
        .client-card { background: var(--card-bg); border-radius: 25px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); transition: all 0.4s ease; position: relative; border: 1px solid #f0f0f0; display: flex; flex-direction: column; justify-content: space-between; }
        .client-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .client-icon { width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }

        .client-name { color: var(--text-gray); font-weight: 700; margin-bottom: 15px; font-size: 1rem; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;}
        .progress-track { background: #e0e0e0; height: 8px; border-radius: 10px; overflow: hidden; margin-bottom: 5px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--primary)); border-radius: 10px; width: 0%; transition: width 1.5s ease-in-out; }

        .chart-section { background: white; border-radius: 30px; padding: 30px; margin-bottom: 50px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); height: 400px; }

</head>

        let mainChart = null;
        const fmt = (n) => n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        const simpleName = (n) => {
            if(!n) return "";
            if(n.includes("نينجا")) return "نينجا (Ninja)";
            if(n.includes("Noon")) return "نون (Noon)";
            if(n.includes("نايس ون")) return "نايس ون (Nice One)";
            if(n.includes("الاميرات")) return "دار الأميرات";
            if(n.includes("مخازن")) return "مخازن العناية";
            if(n.includes("باوزير")) return "مؤسسة باوزير";
            if(n.includes("Alnahdi") || n.includes("النهدي")) return "النهدي (Alnahdi)";
            return n.split(' - ')[0] || n; 
        };

        // --- وظائف التحكم ---
        function openModal() { document.getElementById('pasteModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('pasteModal').style.display = 'none'; }

        function saveData() {
            const input = document.getElementById('pasteInput').value;
            if(!input.trim()) return;
            const rows = input.trim().split('\n');
            const newItems = rows.map(r => {
                const c = r.split('\t');
                return { date: c[0], id: c[1], customer: c[2], value: parseFloat(c[3].replace(/,/g,'')) };
            }).filter(i => !isNaN(i.value));

            allSalesData = [...allSalesData, ...newItems];
            updateMonthSelector();
            filterByMonth();
            closeModal();
            document.getElementById('pasteInput').value = "";
        }

        function updateMonthSelector() {
            const selector = document.getElementById('monthFilter');
            const months = [...new Set(allSalesData.map(d => d.date.substring(3)))];
            selector.innerHTML = '<option value="all">كل الشهور</option>';
            months.forEach(m => {
                const isSelected = m === "01/2026" ? "selected" : "";
                selector.innerHTML += `<option value="${m}" ${isSelected}>${m}</option>`;
            });
        }

        function filterByMonth() {
            const m = document.getElementById('monthFilter').value;
            const filtered = m === 'all' ? allSalesData : allSalesData.filter(d => d.date.includes(m));
            updateDashboard(filtered);
        }

        function updateDashboard(data) {
            let total = 0, max = 0, clients = {}, dates = {};
            data.forEach(item => {
                total += item.value;
                if(item.value > max) max = item.value;
                let s = simpleName(item.customer);
                if(!clients[s]) clients[s] = {total: 0, count: 0};
                clients[s].total += item.value;
                clients[s].count++;
                let d = item.date.substring(0,5);
                dates[d] = (dates[d] || 0) + item.value;
            });

            document.getElementById('heroTotal').innerText = fmt(total) + " SAR";
            document.getElementById('heroCount').innerText = data.length;
            document.getElementById('heroMax').innerText = fmt(max);
            document.getElementById('shareHala').innerText = fmt(total/2) + " SAR";
            document.getElementById('shareMeshal').innerText = fmt(total/2) + " SAR";

            // تحديث العملاء
            const grid = document.getElementById('clientsGrid');
            grid.innerHTML = "";
            Object.entries(clients).sort((a,b) => b[1].total - a[1].total).forEach(([name, d]) => {
                let perc = ((d.total/total)*100).toFixed(1);
                grid.innerHTML += `<div class="client-card">
                    <div class="client-header"><div class="client-icon"><i class="fas fa-user"></i></div></div>
                    <div class="client-name">${name}</div>
                    <div class="client-total">${fmt(d.total)} <small>SAR</small></div>
                    <div class="progress-label"><span>الحصة</span><span>${perc}%</span></div>
                    <div class="progress-track"><div class="progress-fill" style="width:${perc}%"></div></div>
                </div>`;
            });

            renderInvoices(data);
            renderChart(dates);
        }

        function renderInvoices(data, filterText = "") {
            const grid = document.getElementById('invoicesGrid');
            grid.innerHTML = "";
            data.forEach(inv => {
                if(filterText && !simpleName(inv.customer).toLowerCase().includes(filterText)) return;
                let cls = inv.value > 100000 ? "high-value-card super-high-value" : (inv.value > 20000 ? "high-value-card" : "");
                grid.innerHTML += `<div class="invoice-card ${cls}">
                    <div style="font-size:0.8rem; color:#aaa">#${inv.id} | ${inv.date}</div>
                    <div style="font-weight:700; margin:10px 0; height:42px">${simpleName(inv.customer)}</div>
                    <div style="font-size:1.4rem; font-weight:900; align-self:flex-end">${fmt(inv.value)}</div>
                </div>`;
            });
        }

        function renderChart(datesMap) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            const labels = Object.keys(datesMap).sort();
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'المبيعات اليومية',
                        data: labels.map(l => datesMap[l]),
                        borderColor: '#6c5ce7',
                        backgroundColor: 'rgba(108, 92, 231, 0.1)',
                        fill: true, tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const m = document.getElementById('monthFilter').value;
            const currentData = m === 'all' ? allSalesData : allSalesData.filter(d => d.date.includes(m));
            renderInvoices(currentData, e.target.value.toLowerCase());
        });

        // تشغيل أولي
        filterByMonth();
